<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVCharge — İstasyon Detay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <style>
        .station-hero {
            background: linear-gradient(135deg, rgba(0,229,160,.08), rgba(0,168,232,.06));
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }
        .station-hero::before {
            content: '';
            position: absolute;
            top: -50px; right: -50px;
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(0,229,160,.08), transparent 70%);
            pointer-events: none;
        }
        .station-hero h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
        .station-hero .station-address { color: var(--muted); font-size: 15px; margin-bottom: 12px; }
        .station-hero .station-meta { display: flex; gap: 20px; flex-wrap: wrap; }
        .station-hero .meta-item {
            font-size: 14px; color: var(--muted);
            display: flex; align-items: center; gap: 6px;
        }

        .hero-actions { display: flex; gap: 12px; margin-top: 20px; }

        /* Charger grid */
        .charger-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .charger-card {
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            transition: border-color .2s;
        }
        .charger-card:hover { border-color: rgba(0,229,160,.3); }
        .charger-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 14px;
        }
        .charger-name { font-size: 16px; font-weight: 600; }
        .charger-specs { display: flex; flex-direction: column; gap: 6px; }
        .charger-spec {
            font-size: 13px; color: var(--muted);
            display: flex; align-items: center; gap: 8px;
        }
        .charger-spec strong { color: var(--text); }

        /* Compatibility */
        .compat-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
        .compat-ok {
            background: rgba(0,229,160,.08); border: 1px solid rgba(0,229,160,.25);
            color: var(--green); padding: 8px 14px; border-radius: 10px;
            font-size: 13px; font-weight: 600;
        }
        .compat-no {
            background: rgba(255,68,102,.08); border: 1px solid rgba(255,68,102,.25);
            color: var(--danger); padding: 8px 14px; border-radius: 10px;
            font-size: 13px; font-weight: 600;
        }
        .compat-none {
            background: rgba(122,138,171,.08); border: 1px solid rgba(122,138,171,.2);
            color: var(--muted); padding: 8px 14px; border-radius: 10px;
            font-size: 13px;
        }
        .charger-actions { margin-top: 14px; }

        /* ── Sorun Bildirim Modalı ── */
        .report-overlay {
            position: fixed; inset: 0;
            background: rgba(10, 14, 26, 0.92);
            z-index: 200;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .report-overlay.show { opacity: 1; pointer-events: auto; }

        .report-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px;
            width: 90%; max-width: 480px;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .report-overlay.show .report-card { transform: scale(1); }

        .report-card h3 {
            font-size: 20px; font-weight: 700;
            margin-bottom: 6px;
        }
        .report-card .report-sub {
            font-size: 14px; color: var(--muted); margin-bottom: 20px;
        }

        .report-card textarea {
            width: 100%; min-height: 100px; resize: vertical;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text); font-family: inherit; font-size: 14px;
            outline: none;
            transition: border-color 0.25s;
        }
        .report-card textarea:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(0,229,160,0.12);
        }

        .report-actions {
            display: flex; gap: 12px; margin-top: 20px;
        }
        .report-actions .btn { flex: 1; height: 44px; }

        .btn-warning {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: var(--warning);
        }
    </style>
</head>
<body>
    <header class="navbar" id="navbar"></header>

    <div class="container">
        <!-- İstasyon Bilgi Kartı -->
        <div class="station-hero" id="stationHero">
            <p style="color:var(--muted);">İstasyon yükleniyor...</p>
        </div>

        <!-- Şarj Üniteleri -->
        <div class="card">
            <div class="card-header">
                <h2>⚡ Şarj Üniteleri</h2>
                <div>
                    <label style="font-size:13px;color:var(--muted);margin-right:8px;">Aracım:</label>
                    <select class="form-control" id="vehicleSelect" style="display:inline-block;width:auto;min-width:180px;" onchange="renderChargers()">
                        <option value="">Araç seçin (uyumluluk kontrolü)</option>
                    </select>
                </div>
            </div>
            <div class="charger-grid" id="chargerGrid">
                <!-- JS ile doldurulacak -->
            </div>
        </div>
    </div>

    <!-- Sorun Bildirim Modalı -->
    <div class="report-overlay" id="reportModal">
        <div class="report-card">
            <h3>⚠️ Sorun Bildir</h3>
            <p class="report-sub" id="reportStationName">Bu istasyon hakkında bir sorun bildirin.</p>

            <div class="form-group">
                <label>Sorun Kategorisi</label>
                <select class="form-control" id="reportCategory" required>
                    <option value="">Kategori seçin...</option>
                    <option value="broken_charger">🔧 Arızalı Şarj Ünitesi</option>
                    <option value="payment_issue">💳 Ödeme Sorunu</option>
                    <option value="dirty_station">🧹 Kirli / Bakımsız İstasyon</option>
                    <option value="access_problem">🚧 Erişim Sorunu</option>
                    <option value="wrong_info">ℹ️ Yanlış Bilgi (Fiyat, Konum vb.)</option>
                    <option value="safety_concern">🛑 Güvenlik Endişesi</option>
                    <option value="other">📝 Diğer</option>
                </select>
            </div>
            <div class="form-group">
                <label>Açıklama (en az 10 karakter)</label>
                <textarea id="reportDescription" placeholder="Sorunu detaylı şekilde açıklayın..."></textarea>
            </div>

            <div class="report-actions">
                <button class="btn btn-secondary" onclick="closeReportModal()">İptal</button>
                <button class="btn btn-primary" id="reportSubmitBtn" onclick="submitReport()">📨 Gönder</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/reservation.js"></script>
    <script>
        // ── URL'den istasyon ID'si al ──
        const params = new URLSearchParams(window.location.search);
        const stationId = params.get('id');
        let station = null;
        let vehicles = [];
        let isFavorite = false;

        // ── Sayfayı yükle ──
        async function loadPage() {
            const user = await App.requireAuth();
            if (!user) return;
            App.renderNavbar('map');

            try {
                station = await API.getStation(stationId);
            } catch(e) {
                station = null;
            }

            if (station) {
                try {
                    const favorites = await API.getFavorites();
                    isFavorite = favorites.some(f => f.id === station.id);
                } catch(e) {
                    console.error("Favoriler yüklenemedi:", e);
                    isFavorite = false;
                }
            }

            if (!station) {
                document.getElementById('stationHero').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">❌</div>
                        <p>İstasyon bulunamadı.</p>
                        <a href="map.html" class="btn btn-primary btn-sm">Haritaya Dön</a>
                    </div>
                `;
                return;
            }

            renderStationHero();
            await loadVehicleSelect();
            renderChargers();
        }

        // ── İstasyon hero kartı (EV-08) ──
        function renderStationHero() {
            const chargers = station.chargers || [];
            const available = chargers.filter(c => c.status === 'available').length;
            const types = [...new Set(chargers.map(c => c.connector_type))].join(', ');

            document.getElementById('stationHero').innerHTML = `
                <h1>📍 ${station.name}</h1>
                <div class="station-address">${station.address}</div>
                <div class="station-meta">
                    <div class="meta-item">🕐 ${station.operating_hours}</div>
                    <div class="meta-item">⚡ ${available}/${chargers.length} müsait</div>
                    <div class="meta-item">🔌 ${types}</div>
                </div>
                <div class="hero-actions">
                    <a href="reservation.html?station=${station.id}" class="btn btn-primary">📅 Rezervasyon Yap</a>
                    <button class="btn btn-secondary" onclick="toggleFavorite()" id="favBtn">
                        ${isFavorite ? '❤️ Favorilerde' : '🤍 Favorilere Ekle'}
                    </button>
                    <a href="https://www.google.com/maps/dir/?api=1&destination=${station.lat},${station.lng}"
                       target="_blank" class="btn btn-secondary">🧭 Yol Tarifi</a>
                    <button class="btn btn-warning btn-sm" onclick="openReportModal()">⚠️ Sorun Bildir</button>
                    <a href="map.html" class="btn btn-secondary">← Haritaya Dön</a>
                </div>
            `;
        }

        async function toggleFavorite() {
            try {
                const res = await API.toggleFavorite(station.id);
                isFavorite = res.isFavorite;
                const btn = document.getElementById('favBtn');
                if (btn) {
                    btn.innerHTML = isFavorite ? '❤️ Favorilerde' : '🤍 Favorilere Ekle';
                }
                App.showToast(res.message);
            } catch(err) {
                App.showToast('Hata: ' + err.message, 'error');
            }
        }

        // ── Araç seçimi dropdown'ı ──
        async function loadVehicleSelect() {
            try {
                vehicles = await API.getVehicles();
            } catch(e) { vehicles = []; }
            const select = document.getElementById('vehicleSelect');

            vehicles.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.id;
                opt.textContent = `${v.brand} ${v.model} (${v.connector_type})`;
                select.appendChild(opt);
            });
        }

        // ── Şarj ünitelerini göster + uyumluluk kontrolü (EV-13) ──
        function renderChargers() {
            const chargers = station.chargers || [];
            const selectedVehicleId = document.getElementById('vehicleSelect').value;
            const selectedVehicle = vehicles.find(v => String(v.id) === selectedVehicleId);

            const container = document.getElementById('chargerGrid');

            container.innerHTML = chargers.map(charger => {
                const statusMap = {
                    available: { text: 'Müsait', cls: 'badge-available' },
                    occupied: { text: 'Dolu', cls: 'badge-occupied' },
                    offline: { text: 'Çevrimdışı', cls: 'badge-offline' },
                };
                const status = statusMap[charger.status] || statusMap.offline;

                let compatHTML = '';
                if (selectedVehicle) {
                    const isCompatible = Reservation.checkCompatibility(selectedVehicle, charger);
                    if (isCompatible) {
                        compatHTML = `<div class="compat-ok">✅ ${selectedVehicle.brand} ${selectedVehicle.model} ile uyumlu</div>`;
                    } else {
                        compatHTML = `<div class="compat-no">❌ Uyumsuz — Araç: ${selectedVehicle.connector_type}, Şarj: ${charger.connector_type}</div>`;
                    }
                } else {
                    compatHTML = `<div class="compat-none">ℹ️ Uyumluluk kontrolü için araç seçin</div>`;
                }

                const canReserve = charger.status === 'available' &&
                    (!selectedVehicle || Reservation.checkCompatibility(selectedVehicle, charger));
                const pricePerKwh = charger.price_per_kwh || 0;

                return `
                    <div class="charger-card">
                        <div class="charger-header">
                            <div class="charger-name">${charger.type} ${charger.power}kW #${String(charger.id).slice(-2)}</div>
                            <span class="badge ${status.cls}">${status.text}</span>
                        </div>
                        <div class="charger-specs">
                            <div class="charger-spec">🔌 Konnektör: <strong>${charger.connector_type}</strong></div>
                            <div class="charger-spec">⚡ Güç: <strong>${charger.power} kW</strong></div>
                            <div class="charger-spec">💰 Fiyat: <strong>${Number(pricePerKwh).toFixed(2)} ₺/kWh</strong></div>
                            <div class="charger-spec">📊 Tip: <strong>${charger.type}</strong></div>
                        </div>
                        <div class="compat-section">${compatHTML}</div>
                        <div class="charger-actions">
                            ${canReserve
                                ? `<a href="reservation.html?station=${station.id}&charger=${charger.id}${selectedVehicle ? '&vehicle=' + selectedVehicle.id : ''}" class="btn btn-primary btn-sm" style="width:100%;">📅 Bu Üniteyi Rezerve Et</a>`
                                : `<button class="btn btn-secondary btn-sm" style="width:100%;" disabled>${charger.status === 'available' ? 'Uyumsuz' : status.text}</button>`
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }

        loadPage();

        // ── Sorun Bildirim Fonksiyonları ──
        function openReportModal() {
            document.getElementById('reportStationName').textContent =
                `"${station.name}" hakkında bir sorun bildirin.`;
            document.getElementById('reportCategory').value = '';
            document.getElementById('reportDescription').value = '';
            document.getElementById('reportSubmitBtn').disabled = false;
            document.getElementById('reportSubmitBtn').textContent = '📨 Gönder';
            document.getElementById('reportModal').classList.add('show');
        }

        function closeReportModal() {
            document.getElementById('reportModal').classList.remove('show');
        }

        async function submitReport() {
            const category = document.getElementById('reportCategory').value;
            const description = document.getElementById('reportDescription').value.trim();
            const btn = document.getElementById('reportSubmitBtn');

            if (!category) {
                App.showToast('Lütfen bir kategori seçin.', 'error');
                return;
            }
            if (description.length < 10) {
                App.showToast('Açıklama en az 10 karakter olmalıdır.', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Gönderiliyor...';

            try {
                const res = await API.submitReport(station.id, category, description);
                App.showToast('✅ ' + res.message);
                closeReportModal();
            } catch (err) {
                App.showToast('❌ ' + err.message, 'error');
                btn.disabled = false;
                btn.textContent = '📨 Gönder';
            }
        }
    </script>
</body>
</html>
