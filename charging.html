<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVCharge — Şarj Oturumu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <style>
        .charging-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 24px;
            align-items: start;
        }
        @media (max-width: 900px) {
            .charging-layout { grid-template-columns: 1fr; }
        }

        /* Batarya Animasyonu */
        .battery-container {
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }

        .battery-body {
            width: 120px;
            height: 240px;
            border: 4px solid var(--border);
            border-radius: 12px;
            position: relative;
            padding: 4px;
            margin-bottom: 24px;
            background: var(--card);
        }

        .battery-cap {
            width: 40px;
            height: 10px;
            background: var(--border);
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 4px 4px 0 0;
        }

        .battery-level {
            position: absolute;
            bottom: 4px;
            left: 4px;
            right: 4px;
            height: 20%;
            background: var(--green);
            border-radius: 6px;
            transition: height 1s linear, background-color 0.5s;
        }

        .battery-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
            z-index: 2;
        }

        /* Dalga animasyonu */
        .battery-level::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(
                45deg,
                rgba(255,255,255,0.2) 25%,
                transparent 25%,
                transparent 50%,
                rgba(255,255,255,0.2) 50%,
                rgba(255,255,255,0.2) 75%,
                transparent 75%,
                transparent
            );
            background-size: 20px 20px;
            animation: moveStripes 1s linear infinite;
            display: none;
            border-radius: 6px;
        }

        .charging .battery-level::after { display: block; }

        @keyframes moveStripes {
            0% { background-position: 0 0; }
            100% { background-position: 20px 20px; }
        }

        /* Bilgi Paneli */
        .info-panel {
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
        }

        .info-panel h3 {
            font-size: 18px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            font-size: 15px;
        }
        .stat-label { color: var(--muted); }
        .stat-val { font-weight: 600; font-size: 16px; }

        .cost-display {
            background: rgba(0,229,160,.1);
            border: 1px solid rgba(0,229,160,.3);
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
            margin-top: 24px;
            margin-bottom: 24px;
        }
        .cost-display .label { font-size: 13px; color: var(--green); text-transform: uppercase; letter-spacing: 1px; }
        .cost-display .amount { font-size: 32px; font-weight: 700; color: #fff; margin-top: 4px; }

        /* Seçim Alanı */
        .setup-area {
            background: var(--card2);
            padding: 24px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        /* Makbuz Modal */
        .receipt-modal {
            display: none;
            position: fixed; top:0; left:0; right:0; bottom:0;
            background: rgba(10,14,26,0.9);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .receipt-modal.show { display: flex; }
        .receipt-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .receipt-icon { font-size: 48px; margin-bottom: 16px; }
        .receipt-title { font-size: 24px; font-weight: 700; margin-bottom: 24px; }
        .receipt-row {
            display: flex; justify-content: space-between;
            margin-bottom: 12px; font-size: 15px;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 8px;
        }
    </style>
</head>
<body>
    <header class="navbar" id="navbar"></header>

    <div class="container">
        <h1>⚡ Şarj Oturumu</h1>
        
        <!-- Adım 1: Rezervasyon Seçimi -->
        <div id="setupArea" class="setup-area">
            <h3 style="margin-bottom:16px;">Aktif Rezervasyonunuzu Seçin</h3>
            <div class="form-group">
                <select class="form-control" id="resSelect">
                    <option value="">Rezervasyonlar yükleniyor...</option>
                </select>
            </div>
            <div class="form-group">
                <label>Mevcut Batarya Yüzdesi (%)</label>
                <input type="number" class="form-control" id="batteryStart" min="0" max="99" value="20" style="width:100px;">
            </div>
            <button class="btn btn-primary" onclick="startCharging()" id="startBtn">Şarjı Başlat</button>
        </div>

        <!-- Adım 2: Canlı Şarj Ekranı -->
        <div id="chargingArea" class="charging-layout" style="display:none;">
            
            <!-- Batarya Animasyonu -->
            <div class="battery-container" id="batteryContainer">
                <div class="battery-body">
                    <div class="battery-cap"></div>
                    <div class="battery-level" id="batteryLevel"></div>
                    <div class="battery-text" id="batteryText">20%</div>
                </div>
                <h2 id="statusText" style="color:var(--green);">⚡ Şarj Ediliyor...</h2>
            </div>

            <!-- Bilgi Paneli -->
            <div class="info-panel">
                <h3>Oturum Bilgileri</h3>
                
                <div class="stat-row">
                    <span class="stat-label">İstasyon</span>
                    <span class="stat-val" id="infoStation">-</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Başlangıç</span>
                    <span class="stat-val" id="infoStartTime">-</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Tüketilen Enerji</span>
                    <span class="stat-val" id="infoEnergy">0.00 kWh</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Birim Fiyat</span>
                    <span class="stat-val" id="infoPrice">-</span>
                </div>

                <div class="cost-display">
                    <div class="label">Güncel Tutar</div>
                    <div class="amount" id="infoCost">0.00 ₺</div>
                </div>

                <button class="btn btn-danger" style="width:100%; height:50px; font-size:16px;" onclick="stopCharging()">
                    🛑 Şarjı Durdur
                </button>
            </div>
        </div>

    </div>

    <!-- Makbuz Modalı (EV-18) -->
    <div class="receipt-modal" id="receiptModal">
        <div class="receipt-card">
            <div class="receipt-icon">✅</div>
            <div class="receipt-title">Şarj Tamamlandı</div>
            
            <div class="receipt-row">
                <span style="color:var(--muted)">Makbuz No</span>
                <strong id="rcpNo">-</strong>
            </div>
            <div class="receipt-row">
                <span style="color:var(--muted)">Batarya</span>
                <strong><span id="rcpBatStart"></span> ➔ <span id="rcpBatEnd"></span></strong>
            </div>
            <div class="receipt-row">
                <span style="color:var(--muted)">Tüketim</span>
                <strong id="rcpEnergy">-</strong>
            </div>
            <div class="receipt-row">
                <span style="color:var(--muted)">Birim Fiyat</span>
                <strong id="rcpPrice">-</strong>
            </div>
            
            <div style="margin-top:24px; padding:16px; background:rgba(0,229,160,.1); border-radius:8px;">
                <div style="font-size:14px; color:var(--green); margin-bottom:4px;">TOPLAM ÖDENEN</div>
                <div style="font-size:28px; font-weight:700;" id="rcpTotal">-</div>
            </div>

            <button class="btn btn-primary" style="width:100%; margin-top:24px;" onclick="window.location.href='dashboard.html'">
                Panele Dön
            </button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/charging.js"></script>
    <script src="js/reservation.js"></script>
    
    <script>
        let activeReservations = [];

        (async function init() {
            const user = await App.requireAuth();
            if (!user) return;
            App.renderNavbar('charging');

            await loadReservations();
        })();

        async function loadReservations() {
            try {
                activeReservations = await Reservation.getActiveReservations();
                const select = document.getElementById('resSelect');

                if (activeReservations.length === 0) {
                    select.innerHTML = '<option value="">Aktif rezervasyonunuz yok.</option>';
                    document.getElementById('startBtn').disabled = true;
                    return;
                }

                select.innerHTML = activeReservations.map(r => `
                    <option value="${r.id}">
                        ${r.station_name} — ${r.date} ${r.start_slot}
                    </option>
                `).join('');

                // URL'den pre-select
                const params = new URLSearchParams(window.location.search);
                if (params.get('rid')) {
                    select.value = params.get('rid');
                }
            } catch (err) {
                App.showToast('Rezervasyonlar yüklenemedi: ' + err.message, 'error');
            }
        }

        async function startCharging() {
            const resId = document.getElementById('resSelect').value;
            let startBat = parseFloat(document.getElementById('batteryStart').value);

            if (!resId) return;
            if (isNaN(startBat) || startBat < 0 || startBat >= 100) {
                App.showToast('Geçerli bir batarya yüzdesi girin (0-99)', 'error');
                return;
            }

            const btn = document.getElementById('startBtn');
            btn.disabled = true;
            btn.textContent = 'Başlatılıyor...';

            const res = await Charging.startSession(Number(resId), startBat);

            if (!res.success) {
                App.showToast(res.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Şarjı Başlat';
                return;
            }

            // Ekranları değiştir
            document.getElementById('setupArea').style.display = 'none';
            document.getElementById('chargingArea').style.display = 'grid';
            document.getElementById('batteryContainer').classList.add('charging');

            // Bilgileri doldur
            const reservation = activeReservations.find(r => String(r.id) === resId);
            document.getElementById('infoStation').textContent = reservation.station_name;
            document.getElementById('infoStartTime').textContent = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('infoPrice').textContent = res.session.pricePerKwh.toFixed(2) + ' ₺/kWh';

            // Simülasyonu başlat
            updateUI(res.session);
            Charging.simulateCharging(updateUI, handleComplete);
        }

        function updateUI(session) {
            const level = document.getElementById('batteryLevel');
            const text = document.getElementById('batteryText');
            
            // Renk geçişi (Kırmızı -> Sarı -> Yeşil)
            let color = 'var(--danger)';
            if (session.batteryPercent > 20) color = 'var(--warning)';
            if (session.batteryPercent > 60) color = 'var(--green)';

            level.style.height = session.batteryPercent + '%';
            level.style.backgroundColor = color;
            text.textContent = Math.floor(session.batteryPercent) + '%';

            document.getElementById('infoEnergy').textContent = session.energyConsumed.toFixed(2) + ' kWh';
            document.getElementById('infoCost').textContent = session.cost.toFixed(2) + ' ₺';
        }

        function handleComplete(session) {
            document.getElementById('batteryContainer').classList.remove('charging');
            document.getElementById('statusText').textContent = '✅ Şarj Tamamlandı';
            document.getElementById('statusText').style.color = 'var(--text)';
        }

        async function stopCharging() {
            const btn = document.querySelector('.btn-danger');
            btn.disabled = true;
            btn.textContent = 'Durduruluyor...';

            const session = await Charging.stopSession();
            if (session) {
                handleComplete(session);
                showReceipt(session);
            }
        }

        function showReceipt(session) {
            const receipt = Charging.generateReceipt(session);
            
            document.getElementById('rcpNo').textContent = receipt.receiptNo;
            document.getElementById('rcpBatStart').textContent = session.batteryStart + '%';
            document.getElementById('rcpBatEnd').textContent = Math.floor(session.batteryPercent) + '%';
            document.getElementById('rcpEnergy').textContent = receipt.energyConsumed;
            document.getElementById('rcpPrice').textContent = receipt.pricePerKwh;
            document.getElementById('rcpTotal').textContent = receipt.totalCost;

            document.getElementById('receiptModal').classList.add('show');
        }
    </script>
</body>
</html>
