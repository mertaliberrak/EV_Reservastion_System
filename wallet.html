<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVCharge — Cüzdan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <style>
        .wallet-container {
            max-width: 600px;
            margin: 0 auto;
        }
        .balance-card {
            background: linear-gradient(135deg, rgba(0,229,160,.1) 0%, rgba(0,168,232,.1) 100%);
            border: 1px solid var(--green);
            border-radius: var(--radius-lg);
            padding: 40px;
            text-align: center;
            margin-bottom: 24px;
        }
        .balance-title {
            font-size: 16px;
            color: var(--muted);
            margin-bottom: 8px;
        }
        .balance-amount {
            font-size: 48px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 24px;
        }
        .add-funds-section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
        }
        .add-funds-section h3 {
            margin-bottom: 16px;
            font-size: 18px;
        }
        .amount-input-wrapper {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .amount-input-wrapper input {
            flex: 1;
            font-size: 18px;
            padding: 12px;
        }
        .quick-amounts {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .quick-btn {
            background: var(--card2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .quick-btn:hover {
            border-color: var(--green);
            color: var(--green);
        }
        .no-cards-msg {
            color: var(--muted);
            text-align: center;
            padding: 16px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header class="navbar" id="navbar"></header>

    <div class="container wallet-container">
        <h1>💳 Dijital Cüzdan</h1>
        <p style="color:var(--muted); margin-bottom: 24px;">Bakiyenizi yönetin ve rezervasyon ödemelerinizi kolayca yapın.</p>

        <div class="balance-card">
            <div class="balance-title">Mevcut Bakiye</div>
            <div class="balance-amount" id="currentBalance">0.00 ₺</div>
        </div>

        <div class="add-funds-section">
            <h3>Bakiye Yükle</h3>

            <!-- Kart Seçimi -->
            <div class="form-group" style="margin-bottom: 16px;">
                <label for="walletCardSelect">Ödeme Kartı</label>
                <select class="form-control" id="walletCardSelect">
                    <option value="">Yükleniyor...</option>
                </select>
            </div>

            <div class="quick-amounts">
                <button class="quick-btn" onclick="setAmount(50)">+50 ₺</button>
                <button class="quick-btn" onclick="setAmount(100)">+100 ₺</button>
                <button class="quick-btn" onclick="setAmount(500)">+500 ₺</button>
                <button class="quick-btn" onclick="setAmount(1000)">+1000 ₺</button>
            </div>

            <form id="addFundsForm" onsubmit="handleAddFunds(event)">
                <div class="amount-input-wrapper">
                    <input type="number" id="fundAmount" class="form-control" placeholder="Tutar girin (Örn: 250)" min="1" step="0.1" required />
                    <button type="submit" class="btn btn-primary" id="addBtn">Yükle</button>
                </div>
            </form>

            <div id="noCardsMsg" class="no-cards-msg" style="display:none;">
                Henüz kayıtlı kartınız yok. 
                <a href="profile.html" style="color:var(--green);">Profil → Kartlarım</a> kısmından kart ekleyebilirsiniz.
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        let userCards = [];

        (async function init() {
            const user = await App.requireAuth();
            if (!user) return;
            App.renderNavbar('wallet');
            
            updateBalanceUI(user.balance || 0);
            
            // Sunucudan güncel bakiyeyi tekrar teyit et
            try {
                const userData = await API.getMe();
                updateBalanceUI(userData.user.balance || 0);
            } catch (err) {
                console.error('Bakiye alınamadı', err);
            }

            // Kayıtlı kartları yükle
            await loadCards();
        })();

        async function loadCards() {
            try {
                userCards = await API.getCards();
                const select = document.getElementById('walletCardSelect');
                const noCardsMsg = document.getElementById('noCardsMsg');
                const form = document.getElementById('addFundsForm');

                if (!userCards || userCards.length === 0) {
                    select.innerHTML = '<option value="">Kayıtlı kart yok</option>';
                    select.disabled = true;
                    noCardsMsg.style.display = 'block';
                    form.querySelector('button[type="submit"]').disabled = true;
                    return;
                }

                noCardsMsg.style.display = 'none';
                select.disabled = false;
                form.querySelector('button[type="submit"]').disabled = false;
                select.innerHTML = userCards.map(c => 
                    `<option value="${c.id}">${c.card_name} — ${c.card_number}</option>`
                ).join('');
            } catch (err) {
                console.error('Kartlar yüklenemedi', err);
            }
        }

        function updateBalanceUI(amount) {
            document.getElementById('currentBalance').textContent = Number(amount).toFixed(2) + ' ₺';
        }

        function setAmount(val) {
            document.getElementById('fundAmount').value = val;
        }

        async function handleAddFunds(e) {
            e.preventDefault();
            const btn = document.getElementById('addBtn');
            const amountInput = document.getElementById('fundAmount');
            const cardSelect = document.getElementById('walletCardSelect');
            const amount = parseFloat(amountInput.value);
            const cardId = cardSelect.value;

            if (!amount || amount <= 0) {
                App.showToast('Geçerli bir tutar girin', 'error');
                return;
            }

            if (!cardId) {
                App.showToast('Lütfen bir ödeme kartı seçin', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'İşleniyor...';

            try {
                const res = await API.addBalance(amount, parseInt(cardId));
                App.showToast('✅ ' + res.message);
                // Güncel bakiyeyi çek
                const userData = await API.getMe();
                updateBalanceUI(userData.user.balance || 0);
                amountInput.value = '';
            } catch (err) {
                App.showToast('Hata: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Yükle';
            }
        }
    </script>
</body>
</html>
