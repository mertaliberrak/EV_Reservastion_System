<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EV Charge – Şifremi Unuttum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --green: #00e5a0;
            --green2: #00b87a;
            --dark: #0a0e1a;
            --card: #121829;
            --border: rgba(0, 229, 160, .18);
            --text: #e4eaf6;
            --muted: #7a8aab;
        }
        body {
            min-height: 100vh;
            background: var(--dark);
            font-family: 'Outfit', sans-serif;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 80%, rgba(0, 229, 160, .08) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 20%, rgba(0, 120, 255, .07) 0%, transparent 60%);
            pointer-events: none;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 44px 44px 40px;
            width: min(460px, 94vw);
            box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
            position: relative;
            z-index: 1;
        }
        .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--green), #00a8e8); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .logo-text { font-size: 22px; font-weight: 700; letter-spacing: .5px; }
        .logo-text span { color: var(--green); }
        h2 { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
        .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 32px; }
        
        .field { margin-bottom: 18px; }
        label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 7px; letter-spacing: .3px; }
        input {
            width: 100%;
            background: rgba(255, 255, 255, .04);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 13px 16px;
            color: var(--text);
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: border-color .25s, box-shadow .25s;
        }
        input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(0, 229, 160, .12); }
        
        .btn {
            margin-top: 10px;
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--green2), var(--green));
            border: none;
            border-radius: 14px;
            color: #0a0e1a;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity .2s, transform .15s;
        }
        .btn:hover { opacity: .92; transform: translateY(-1px); }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        
        .card-footer { text-align: center; margin-top: 22px; font-size: 13px; color: var(--muted); }
        .card-footer a { color: var(--green); text-decoration: none; }
        
        .toast {
            position: absolute; top: 14px; left: 50%; transform: translateX(-50%) translateY(-8px);
            background: rgba(255, 68, 102, .12); border: 1px solid rgba(255, 68, 102, .4); color: #ff7a95;
            font-size: 13px; padding: 9px 18px; border-radius: 99px; opacity: 0; pointer-events: none;
            transition: opacity .25s, transform .25s; z-index: 30;
        }
        .toast.success { background: rgba(0, 229, 160, .12); border-color: var(--green); color: var(--green); }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        
        .step { display: none; }
        .step.active { display: block; }

        .demo-alert {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.5);
            color: #ffd700;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <div class="logo-icon">⚡</div>
            <div class="logo-text">EV<span>Charge</span></div>
        </div>
        
        <!-- Adım 1: E-posta -->
        <div id="step1" class="step active">
            <h2>Şifremi Unuttum</h2>
            <p class="subtitle">Kayıtlı e-posta adresinizi giriniz.</p>
            <form id="forgotForm">
                <div class="field">
                    <label>E-posta</label>
                    <input type="email" id="email" placeholder="ornek@email.com" required />
                </div>
                <button type="submit" class="btn" id="forgotBtn">Sıfırlama Kodu Gönder</button>
            </form>
            <div class="card-footer">
                Vazgeçtiniz mi? <a href="login.html">Giriş Yap</a>
            </div>
        </div>

        <!-- Adım 2: Kod ve Yeni Şifre -->
        <div id="step2" class="step">
            <h2>Yeni Şifre Belirle</h2>
            <p class="subtitle">E-postanıza (demo ekranına) gelen 6 haneli kodu girin.</p>
            
            <div id="demoCodeDisplay" class="demo-alert" style="display: none;">
                <strong>DEMO KODU:</strong> <span id="theCode" style="font-size:18px; letter-spacing:2px; font-weight:bold;"></span>
            </div>

            <form id="resetForm">
                <div class="field">
                    <label>Doğrulama Kodu</label>
                    <input type="text" id="code" placeholder="123456" required autocomplete="off" />
                </div>
                <div class="field">
                    <label>Yeni Şifre</label>
                    <input type="password" id="newPassword" placeholder="••••••••" required />
                </div>
                <button type="submit" class="btn" id="resetBtn">Şifreyi Güncelle</button>
            </form>
        </div>

        <div class="toast" id="toast"></div>
    </div>

    <script src="js/api.js"></script>
    <script>
        const toast = document.getElementById('toast');
        let toastTimer = null;
        let userEmail = '';

        function showToast(msg, type = 'error') {
            toast.textContent = msg;
            toast.className = 'toast show ' + type;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 4000);
        }

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('forgotBtn');
            
            btn.disabled = true;
            btn.textContent = 'Gönderiliyor...';

            try {
                const res = await API.forgotPassword(email);
                userEmail = email;
                
                // Adım 2'ye geç
                document.getElementById('step1').classList.remove('active');
                document.getElementById('step2').classList.add('active');
                
                // Demo kodu ekrana yaz
                if (res.demo_code) {
                    document.getElementById('demoCodeDisplay').style.display = 'block';
                    document.getElementById('theCode').textContent = res.demo_code;
                }
                
                showToast(res.message, 'success');
            } catch (err) {
                showToast(err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sıfırlama Kodu Gönder';
            }
        });

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('code').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const btn = document.getElementById('resetBtn');
            
            btn.disabled = true;
            btn.textContent = 'Güncelleniyor...';

            try {
                const res = await API.resetPassword(userEmail, code, newPassword);
                showToast(res.message, 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } catch (err) {
                showToast(err.message);
                btn.disabled = false;
                btn.textContent = 'Şifreyi Güncelle';
            }
        });
    </script>
</body>
</html>
